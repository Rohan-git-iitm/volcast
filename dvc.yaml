stages:
  download:
    cmd: python -m src.data.download
    deps:
    - src/data/download.py
    params:
    - configs/config.yaml:
      - data.symbols
      - data.start_date
      - data.end_date
    outs:
    - data/raw:
        persist: true

  thresholds:
    cmd: python -m src.data.thresholds
    deps:
    - src/data/thresholds.py
    - src/data/trades.py
    - src/utils/spark.py
    - data/raw
    params:
    - configs/config.yaml:
      - data.large_trade_quantile
      - data.threshold_days
    outs:
    - artifacts/thresholds.json:
        cache: false

  bars:
    cmd: python -m src.data.bars
    deps:
    - src/data/bars.py
    - src/data/trades.py
    - src/utils/spark.py
    - data/raw
    - artifacts/thresholds.json
    outs:
    - data/bars:
        persist: true
    metrics:
    - metrics/bars.json:
        cache: false

  features:
    cmd: python -m src.features.make_features
    deps:
    - src/features/build.py
    - src/features/make_features.py
    - data/bars
    params:
    - configs/config.yaml:
      - model.horizon_minutes
      - data.start_date
      - data.end_date
    outs:
    - data/features

  train:
    cmd: python -m src.models.train
    deps:
    - src/models/train.py
    - src/features/build.py
    - data/features
    params:
    - configs/config.yaml:
      - model.test_days
      - model.lgbm
    outs:
    - artifacts/train_runs.json:
        cache: false
    metrics:
    - metrics/train.json:
        cache: false

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
    - src/models/evaluate.py
    - metrics/train.json
    - artifacts/train_runs.json
    - data/features
    metrics:
    - metrics/evaluate.json:
        cache: false
  export:
    cmd: MLFLOW_TRACKING_URI=sqlite:///mlflow.db mlflow artifacts download 
      --artifact-uri models:/volcast@champion --dst-path models/champion
    deps:
    - metrics/evaluate.json
    outs:
    - models/champion
  reference:
    cmd: python -m src.monitoring.reference
    deps:
    - data/features/features.parquet
    - src/monitoring/reference.py
    outs:
    - models/reference.json
