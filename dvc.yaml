stages:
  download:
    cmd: python -m src.data.download
    deps:
      - src/data/download.py
    params:
      - configs/config.yaml:
          - data.symbols
          - data.start_date
          - data.end_date
    outs:
      - data/raw:
          persist: true
  bars:
    cmd: python -m src.data.bars
    deps:
      - src/data/bars.py
      - data/raw
    outs:
      - data/bars:
          persist: true
    metrics:
      - metrics/bars.json:
          cache: false
