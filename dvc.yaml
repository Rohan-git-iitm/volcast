stages:
  download:
    cmd: python -m src.data.download
    deps:
      - src/data/download.py
    params:
      - configs/config.yaml:
          - data.symbols
          - data.start_date
          - data.end_date
    outs:
      - data/raw:
          persist: true

  thresholds:
    cmd: python -m src.data.thresholds
    deps:
      - src/data/thresholds.py
      - src/data/trades.py
      - src/utils/spark.py
      - data/raw
    params:
      - configs/config.yaml:
          - data.large_trade_quantile
          - data.threshold_days
    outs:
      - artifacts/thresholds.json:
          cache: false

  bars:
    cmd: python -m src.data.bars
    deps:
      - src/data/bars.py
      - src/data/trades.py
      - src/utils/spark.py
      - data/raw
      - artifacts/thresholds.json
    outs:
      - data/bars:
          persist: true
    metrics:
      - metrics/bars.json:
          cache: false

  features:
    cmd: python -m src.features.make_features
    deps:
      - src/features/build.py
      - src/features/make_features.py
      - data/bars
    params:
      - configs/config.yaml:
          - model.horizon_minutes
    outs:
      - data/features
