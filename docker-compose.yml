services:
  model-server:
    build: .
    image: volcast
    command: mlflow models serve -m models/champion -h 0.0.0.0 -p 5001 --env-manager local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping')"]
      interval: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  backend:
    image: volcast
    pull_policy: never
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      MODEL_URL: http://model-server:5001
      PRED_DB: /data/predictions.db
    volumes:
      - predictions:/data
    ports:
      - "8000:8000"
    depends_on:
      model-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3
    restart: unless-stopped

volumes:
  predictions:
