services:
  model-server:
    build: .
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
    environment:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    command: mlflow models serve -m models:/volcast@champion -h 0.0.0.0 -p 5001 --env-manager local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping')"]
      interval: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  backend:
    build: .
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
    environment:
      MODEL_URL: http://model-server:5001
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      model-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3
    restart: unless-stopped
