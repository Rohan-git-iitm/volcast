services:
  model-server:
    build: .
    image: volcast
    command: mlflow models serve -m models/champion -h 0.0.0.0 -p 5001 --env-manager local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ping')"]
      interval: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  backend:
    image: volcast
    pull_policy: never
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      MODEL_URL: http://model-server:5001
      PRED_DB: /data/predictions.db
    volumes:
      - predictions:/data
    ports:
      - "8000:8000"
    depends_on:
      model-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  predictions:
  prometheus-data:
  grafana-data:
